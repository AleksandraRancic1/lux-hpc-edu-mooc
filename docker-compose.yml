services:

  login01:
    image: ghcr.io/aleksandrarancic1/lux-hpc-login-mooc:v0.2.0
    container_name: login01
    hostname: login01

    ports:
      - "127.0.0.1:2222:22"

    volumes:
      - home:/home
      - scratch:/scratch
      - logs:/logs
      - jobs:/jobs
      - modules:/modules
      - /var/run/docker.sock:/var/run/docker.sock

    networks:
      - hpc


  compute001:
    image: ghcr.io/aleksandrarancic1/lux-hpc-compute-mooc:v0.1.0
